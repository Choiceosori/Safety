<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재난 대응 도시 탐구실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy observation-deck header + tab rail; blueprint-grid ground; paper panels in 3 columns (conditions / visual / notes) on desktop, stacked on tablet & phone */
:root{
  --navy-950:#102637; --navy-800:#1B3A50; --navy-700:#27506B;
  --hdr-ink:#EAF2F7; --hdr-muted:#A9C1D1;
  --teal-600:#087F80; --teal-700:#066566; --teal-100:#D8F0EC;
  --amber-500:#E7AC48; --amber-700:#8A5A0C; --amber-100:#FFF1D8;
  --btn:#087F80; --on-btn:#FFFFFF; --on-amber:#1D2D3A;
  --bg:#E8EEF2; --grid:#D9E3EA; --paper:#F7F9FB; --panel:#FFFFFF;
  --ink:#1D2D3A; --muted:#4D6070; --line:#CAD5DD;
  --error:#B8444B; --error-bg:#FBE9EA; --ok:#2C7A4B; --ok-bg:#E3F3E9;
  --water:#2F78AE; --water-soft:#CFE3F1; --sky:#EEF5FA;
  --asphalt:#5A6670; --soil:#9C7448; --veg:#4E8C4A; --perm:#93A0AB; --bldg:#B9C6D0;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --teal-600:#4CC1BA; --teal-700:#7AD6CF; --teal-100:#123E40;
  --amber-700:#F2C673; --amber-100:#3A2D12;
  --btn:#3FB3AC; --on-btn:#05211F;
  --bg:#0A1A25; --grid:#10273A; --paper:#0F2333; --panel:#132B3D;
  --ink:#E2EBF1; --muted:#A3B6C4; --line:#2B4A60;
  --error:#F28B92; --error-bg:#3B1C21; --ok:#7FD3A0; --ok-bg:#163526;
  --water:#6CB0E3; --water-soft:#1B3B53; --sky:#11283A;
  --asphalt:#7D8A95; --soil:#B48A5C; --veg:#6FAE69; --perm:#A9B5BF; --bldg:#33536B;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --teal-600:#4CC1BA; --teal-700:#7AD6CF; --teal-100:#123E40;
  --amber-700:#F2C673; --amber-100:#3A2D12;
  --btn:#3FB3AC; --on-btn:#05211F;
  --bg:#0A1A25; --grid:#10273A; --paper:#0F2333; --panel:#132B3D;
  --ink:#E2EBF1; --muted:#A3B6C4; --line:#2B4A60;
  --error:#F28B92; --error-bg:#3B1C21; --ok:#7FD3A0; --ok-bg:#163526;
  --water:#6CB0E3; --water-soft:#1B3B53; --sky:#11283A;
  --asphalt:#7D8A95; --soil:#B48A5C; --veg:#6FAE69; --perm:#A9B5BF; --bldg:#33536B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy-950)}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:24px} h3{font-size:19px} h4{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber-500);outline-offset:2px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy-950);color:var(--hdr-ink);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.top-row{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:10px}
.unit{font-family:var(--font-mono);font-weight:600;font-size:15px;border:1.5px solid var(--hdr-muted);border-radius:6px;padding:2px 8px;color:var(--hdr-ink)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--hdr-muted);font-size:13px}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.session{font-size:13px;color:var(--hdr-ink);background:var(--navy-700);border-radius:999px;padding:4px 10px}
.save{font-size:13px;color:var(--hdr-muted);display:inline-flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:#59C49A;display:inline-block}
.save[data-s="saving"] i{background:#E7AC48}.save[data-s="fail"] i{background:#F0828A}
.hbtn{background:transparent;border:1px solid #4C6E86;color:var(--hdr-ink);border-radius:8px;min-height:40px;padding:4px 12px;cursor:pointer;font-size:14px}
.hbtn:hover{background:var(--navy-800)}
.tabs{background:var(--navy-800);overflow-x:auto;scrollbar-width:thin}
.tabs ul{list-style:none;margin:0 auto;display:flex;gap:4px;padding-block:6px 0;max-width:1360px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{display:flex;align-items:center;gap:8px;white-space:nowrap;background:transparent;border:0;color:var(--hdr-muted);padding:10px 14px 12px;min-height:48px;cursor:pointer;border-radius:8px 8px 0 0;border-bottom:3px solid transparent;font-size:15px}
.tab:hover{color:var(--hdr-ink);background:rgba(255,255,255,.05)}
.tab svg{width:18px;height:18px;flex:none}
.tab .kind{font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:1px 6px;background:#0F4D50;color:#BFEDE7}
.tab[data-k="발명"] .kind{background:#5A3F0E;color:#FFE2A8}
.tab[data-k="기록"] .kind{background:#33475A;color:#E1E9EF}
.tab[aria-selected="true"]{color:#fff;background:var(--paper);color:var(--ink);border-bottom-color:#4CC1BA}
.tab[aria-selected="true"][data-k="발명"]{border-bottom-color:var(--amber-500)}
.tab[aria-selected="true"][data-k="기록"]{border-bottom-color:#9FB3C2}
.tab[aria-selected="true"] .kind{background:var(--teal-600);color:var(--on-btn)}
.tab[aria-selected="true"][data-k="발명"] .kind{background:var(--amber-500);color:var(--on-amber)}
.tab[aria-selected="true"][data-k="기록"] .kind{background:var(--muted);color:var(--panel)}

main{padding-block:20px 40px}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:8px 12px;background:var(--paper)}
.notice b{color:var(--ink)}
.hero{display:grid;gap:6px;margin-bottom:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--teal-700)}
.inv .eyebrow{color:var(--amber-700)}
.question{font-size:15px;background:var(--teal-100);border-radius:8px;padding:8px 12px;color:var(--ink)}
.inv .question{background:var(--amber-100)}
.grid3{display:grid;gap:16px;grid-template-columns:1fr}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}.grid3>.side-r{grid-column:1/-1}}
@media (min-width:1180px){.grid3{grid-template-columns:minmax(260px,.95fr) minmax(0,1.6fr) minmax(260px,1fr)}.grid3>.side-r{grid-column:auto}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel.note{background:var(--paper)}
.panel h3{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1.5px solid currentColor;white-space:nowrap}
.b-virtual{color:var(--muted)} .b-exp{color:var(--teal-700)} .b-sim{color:var(--water)} .b-idea{color:var(--amber-700)} .b-case{color:var(--muted)} .b-tech{color:var(--teal-700)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
label.f span.hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;width:100%;font-weight:400;font-size:16px}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--teal-600)}
input.bad{border-color:var(--error);background:var(--error-bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:8px;border:1.5px solid var(--btn);background:var(--btn);color:var(--on-btn);font-weight:600;cursor:pointer;font-size:15px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--teal-700);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--teal-600)}
.btn.amber{background:var(--amber-500);border-color:var(--amber-500);color:var(--on-amber)}
.btn.danger{background:var(--error);border-color:var(--error);color:var(--panel)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;border-right:1px solid var(--line);padding:6px 10px;min-height:40px;cursor:pointer;font-size:14px;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--teal-600);color:var(--on-btn);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--teal-600);background:var(--teal-100);font-weight:600}
.folders{display:flex;flex-direction:column;gap:8px}
.folder{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:4px 10px 10px 10px;padding:10px 12px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:2px}
.folder::before{content:"";position:absolute;left:-1.5px;top:-9px;width:64px;height:9px;border:1.5px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--paper)}
.folder[aria-pressed="true"]{border-color:var(--teal-600);background:var(--teal-100)}
.folder[aria-pressed="true"]::before{border-color:var(--teal-600);background:var(--teal-100)}
.folder b{font-size:16px}
.clue{display:grid;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.clue p{font-size:15px}
.clue .src{font-size:12px;color:var(--muted)}
.refnote{font-size:13px;color:var(--muted);border-left:3px solid var(--teal-600);padding-left:8px}
.svgbox{border:1px solid var(--line);border-radius:8px;background:var(--sky);overflow:hidden}
.svgbox svg{display:block;width:100%;height:auto}
.svgcap{font-size:12px;color:var(--muted);padding:4px 10px;border-top:1px solid var(--line);background:var(--paper)}
.qcard{border:1.5px solid var(--line);border-radius:10px;padding:14px;background:var(--paper);display:grid;gap:8px}
.qcard .tag{font-size:12px;font-weight:700;color:var(--teal-700)}
.techgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tcard{border:1px solid var(--line);border-radius:10px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.tcard .tbody{padding:12px;display:grid;gap:6px;font-size:14px}
.tcard .tbody dt{font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.04em}
.tcard .tbody dd{margin:0 0 4px}
.tcard svg{display:block;width:100%;height:auto;background:var(--sky);border-bottom:1px solid var(--line)}
.role{font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--teal-100);color:var(--teal-700)}
.match-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.fb{font-size:13px;border-radius:6px;padding:4px 8px}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.hint{background:var(--amber-100);color:var(--amber-700)}
.err{color:var(--error);font-size:13px}
.steps{counter-reset:st}
.stepbox{border-top:2px solid var(--line);padding-top:12px;display:grid;gap:10px}
.stephead{display:flex;align-items:baseline;gap:10px}
.stephead .n{font-family:var(--font-mono);font-weight:600;color:var(--teal-700);font-size:14px;border:1.5px solid var(--teal-600);border-radius:6px;padding:0 6px}
.inv .stephead .n{color:var(--amber-700);border-color:var(--amber-500)}
.cv3{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:760px){.cv3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cvbox{border:1.5px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;align-content:start}
.cvbox h4{font-size:14px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:15px;cursor:pointer;min-height:32px}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--teal-600)}
.mcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--paper)}
.mrow{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:620px){.mrow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.run{display:grid;gap:4px;align-content:start}
.run .lab{font-size:13px;font-weight:600}
.run .st{font-size:12px;color:var(--muted)}
.run .st.bad{color:var(--error)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--paper);font-weight:700;font-size:13px}
td.n,th.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.missing{color:var(--muted);font-style:italic}
.slider{display:grid;gap:4px}
.slider .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slider .top2 label{font-weight:600;font-size:14px}
.slider .numin{display:flex;align-items:center;gap:6px}
.slider .numin input{width:86px;min-height:40px;text-align:right;font-family:var(--font-mono)}
input[type=range]{width:100%;accent-color:var(--teal-600);min-height:32px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--ink)}
.toggle{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:var(--paper);text-align:left;width:100%}
.toggle[aria-pressed="true"]{border-color:var(--teal-600);background:var(--teal-100)}
.toggle[disabled]{opacity:.55;cursor:not-allowed}
.toggle .box{width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;flex:none;display:grid;place-items:center;font-weight:700;margin-top:2px}
.toggle[aria-pressed="true"] .box{background:var(--teal-600);border-color:var(--teal-600);color:var(--on-btn)}
.toggle .tt{display:grid;gap:2px;font-size:14px}
.toggle .cost{margin-left:auto;font-family:var(--font-mono);font-weight:600;white-space:nowrap}
.budget{display:flex;gap:4px;align-items:center}
.budget i{width:26px;height:14px;border:1.5px solid var(--teal-600);border-radius:3px}
.budget i.on{background:var(--teal-600)}
.resgrid{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:620px){.resgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.res{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.res .k{font-size:12px;color:var(--muted);font-weight:600}
.res .v{font-family:var(--font-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.res .v small{font-size:14px;margin-left:2px}
.res.em{border-color:var(--water);border-width:2px}
details.how{border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}
details.how summary{cursor:pointer;padding:10px 12px;font-weight:700;min-height:44px}
details.how .in{padding:0 12px 12px;display:grid;gap:8px;font-size:14px}
code,.formula{font-family:var(--font-mono);font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:block;overflow-x:auto;white-space:pre}
.warn{border:1.5px solid var(--amber-500);background:var(--amber-100);border-radius:8px;padding:8px 12px;font-size:14px}
.okbox{border:1.5px solid var(--ok);background:var(--ok-bg);border-radius:8px;padding:8px 12px;font-size:14px}
.abtbl td:first-child,.abtbl th:first-child{white-space:nowrap}
.abhead{display:flex;gap:8px;flex-wrap:wrap}
.ev{border:1.5px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px;background:var(--panel)}
.ev.sel{border-color:var(--amber-500);background:var(--amber-100)}
.ev .t{font-weight:700;font-size:15px}
.ev .d{font-size:14px;white-space:pre-wrap}
.flow4{display:grid;gap:8px}
.flow4 .fstep{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);font-size:14px;position:relative}
.flow4 .fstep b{display:block;font-size:12px;color:var(--amber-700);letter-spacing:.04em}
.flow4 .arrow{text-align:center;color:var(--muted);font-size:14px;line-height:1}
.modes{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mode{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);cursor:pointer;text-align:left;display:grid;gap:4px}
.mode[aria-pressed="true"]{border-color:var(--amber-500);background:var(--amber-100)}
.mode b{font-size:16px}
.inv .btn{background:var(--amber-500);border-color:var(--amber-500);color:var(--on-amber)}
.inv .btn.ghost{background:transparent;color:var(--amber-700);border-color:var(--line)}
.inv .chip[aria-pressed="true"]{border-color:var(--amber-500);background:var(--amber-100)}
.inv .check input{accent-color:var(--amber-700)}
.stepnav{display:flex;gap:6px;flex-wrap:wrap}
.stepnav a{font-size:14px;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--paper);min-height:40px;display:inline-flex;align-items:center}
.sketchbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sketchbar .colorbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sketchbar .colorbtn[aria-pressed="true"]{outline:3px solid var(--amber-500);outline-offset:1px}
canvas#sketch{width:100%;height:auto;aspect-ratio:900/560;max-width:100%;border:1.5px solid var(--line);border-radius:8px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:12px;color:var(--muted);font-size:14px;background:var(--paper)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,20,30,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--panel);color:var(--ink);border-radius:12px;max-width:720px;width:100%;padding:20px;display:grid;gap:14px;margin-block:24px;border:1px solid var(--line)}
.modal .box.wide{max-width:960px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy-950);color:var(--hdr-ink);padding:10px 16px;border-radius:8px;z-index:60;font-size:15px;max-width:calc(100% - 32px)}

/* report */
.report{background:#fff;color:#1D2D3A;border:1px solid var(--line);border-radius:6px;max-width:820px;margin:0 auto;padding:36px 40px;display:grid;gap:22px;font-size:14.5px}
.report h2{font-size:22px} .report h3{font-size:17px;border-bottom:2px solid #1D2D3A;padding-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.report section{display:grid;gap:8px;break-inside:auto}
.report table{background:#fff;color:#1D2D3A}
.report th{background:#EEF2F5;color:#1D2D3A}
.report th,.report td{border-bottom:1px solid #C3CED6}
.report .tbl-wrap{border-color:#C3CED6}
.report .missing{color:#6A7A86}
.report .rtag{font-size:11px;font-weight:700;border:1.5px solid #1D2D3A;border-radius:4px;padding:1px 6px;letter-spacing:.03em}
.report .kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px}
.report .kv dt{font-weight:700;color:#4D6070}
.report .kv dd{margin:0;white-space:pre-wrap}
.report .disc{border-top:1.5px solid #1D2D3A;padding-top:8px;font-size:13px}
.report .rsvg{border:1px solid #C3CED6;border-radius:6px}
.report .rsvg svg{display:block;width:100%;height:auto}
.report img.sk{border:1px solid #C3CED6;max-height:340px;object-fit:contain;background:#fff}
.report .rsvg{--ink:#1D2D3A;--muted:#4D6070;--line:#C3CED6;--panel:#fff;--paper:#F4F7F9;--water:#2F78AE;--water-soft:#CFE3F1;--teal-600:#087F80;--amber-500:#E7AC48;--sky:#fff}
@media (max-width:600px){.report{padding:20px 16px}.report .kv{grid-template-columns:1fr}}
#print-report{display:none}
@media print{
  @page{size:A4 portrait;margin:14mm}
  body{background:#fff !important;background-image:none !important}
  body::before{display:none}
  #app,.modal,.toast{display:none !important}
  #print-report{display:block}
  .report{border:0;padding:0;max-width:none;font-size:11pt}
  .report table,.report .rsvg,.report img,.report .kv{break-inside:avoid}
  .report h3{break-after:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.rain line{animation:fall 1.4s linear infinite}
@keyframes fall{from{transform:translateY(-12px);opacity:.2}to{transform:translateY(14px);opacity:.8}}
</style>

function readStored(){ try{ const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function merge(base, src){
  if(!src || typeof src!=='object' || Array.isArray(src)) return base;
  for(const k of Object.keys(base)){
    if(!(k in src)) continue;
    const b = base[k], v = src[k];
    if(b && typeof b==='object' && !Array.isArray(b)) base[k] = merge(b, v);
    else if(Array.isArray(b)) { if(Array.isArray(v)) base[k] = v; }
    else if(b===null) base[k] = (v && typeof v==='object') ? v : null;
    else if(typeof v===typeof b) base[k] = v;
  }
  return base;
}
function sanitize(st){
  const s = merge(defaults(), st);
  // simulation ranges
  s.sim.precipitationMm = clamp(Math.round(num(s.sim.precipitationMm,50)/10)*10, 10, 120);
  s.sim.surfacePercent = fixPercent(s.sim.surfacePercent);
  s.sim.selectedTechIds = cleanTechs(s.sim.selectedTechIds);
  for(const k of ['simulationA','simulationB']){
    const v = s[k];
    if(v && v.config){ const c = sanitizeConfig(v.config); s[k] = {config:c, result:calcModel(c), savedAt: typeof v.savedAt==='string'?v.savedAt:''}; }
    else s[k] = null;
  }
  // experiment
  s.exp.surfaces = (Array.isArray(s.exp.surfaces)?s.exp.surfaces:[]).slice(0,6).map(x=>{
    const sf = newSurface('', '');
    if(x && typeof x==='object'){
      sf.id = typeof x.id==='string'?x.id:sf.id; sf.name = str(x.name); sf.poured = str(x.poured); sf.duration = str(x.duration); sf.observation = str(x.observation);
      if(Array.isArray(x.runs)) sf.runs = [0,1,2].map(i=>({value:str(x.runs[i]&&x.runs[i].value), failed:!!(x.runs[i]&&x.runs[i].failed)}));
    }
    return sf;
  });
  if(!s.exp.surfaces.length) s.exp.surfaces = [newSurface('방수 시트')];
  s.exp.controlled = s.exp.controlled.filter(x=>typeof x==='string');
  if(!CASES[s.selectedCaseId]) s.selectedCaseId='A';
  if(!TABS.find(t=>t.id===s.tab)) s.tab='case';
  if(!FLOW[s.flowSurface]) s.flowSurface='impervious';
  s.compareTech = s.compareTech.filter(id=>TECH_BY[id]).slice(0,2);
  s.evidence = s.evidence.filter(e=>e && typeof e.id==='string' && typeof e.title==='string');
  s.invention.existingTechnologyIds = s.invention.existingTechnologyIds.filter(id=>TECH_BY[id]).slice(0,2);
  s.invention.evidenceIds = s.invention.evidenceIds.filter(id=>s.evidence.some(e=>e.id===id));
  if(typeof s.invention.sketchDataUrl!=='string' || (s.invention.sketchDataUrl && !s.invention.sketchDataUrl.startsWith('data:image/'))) s.invention.sketchDataUrl='';
  return s;
}
function sanitizeConfig(c){
  c = c||{};
  return {precipitationMm: clamp(Math.round(num(c.precipitationMm,50)/10)*10,10,120), areaM2:AREA,
    surfacePercent: fixPercent(c.surfacePercent||{}), selectedTechIds: cleanTechs(c.selectedTechIds||[])};

function cleanTechs(ids){
  const out=[]; let cost=0;
  (Array.isArray(ids)?ids:[]).forEach(id=>{ const t=SIM_TECH_BY[id]; if(t && !out.includes(id) && cost+t.cost<=BUDGET){ out.push(id); cost+=t.cost; } });
  return out;
}
function fixPercent(p){
  let a = clamp(Math.round(num(p.asphalt,60)),0,100), so = clamp(Math.round(num(p.soil,25)),0,100), v = clamp(Math.round(num(p.vegetation,15)),0,100);
  const sum = a+so+v;
  if(sum!==100){ if(sum===0) return {asphalt:60,soil:25,vegetation:15}; a=Math.round(a*100/sum); so=Math.round(so*100/sum); v=100-a-so; if(v<0){ so+=v; v=0; } }
  return {asphalt:a, soil:so, vegetation:v};
}

function fmt(n, d){ if(n==null || !Number.isFinite(n)) return '–'; const p = Math.pow(10, d==null?1:d); const r = Math.round(n*p)/p; return r.toLocaleString('ko-KR', {maximumFractionDigits: d==null?1:d}); }

/* ---------------- model ---------------- */
function calcModel(cfg){
  const has = id => cfg.selectedTechIds.includes(id);
  const p = Math.max(0, num(cfg.precipitationMm,0));
  const a = AREA;
  let asphaltArea = a*cfg.surfacePercent.asphalt/100;
  const soilArea = a*cfg.surfacePercent.soil/100;
  const vegetationArea = a*cfg.surfacePercent.vegetation/100;
  const permeableArea = has('permeable') ? Math.min(20, asphaltArea) : 0;
  asphaltArea -= permeableArea;
  const runoffL = p*(asphaltArea*COEF.asphalt + soilArea*COEF.soil + vegetationArea*COEF.vegetation + permeableArea*COEF.permeable);
  const storageCapL = (has('rainGarden')?600:0) + (has('storageTank')?1500:0);
  const drainCapL = BASE_DRAIN + (has('drainUpgrade')?1000:0);
  const actualStorageL = Math.min(runoffL, storageCapL);
  const actualDrainageL = Math.min(Math.max(0, runoffL-actualStorageL), drainCapL);
  const remainingL = Math.max(0, runoffL-actualStorageL-actualDrainageL);
  const r = x => Math.round(x*1000)/1000;
  return {rainL:r(p*a), runoffL:r(runoffL), actualStorageL:r(actualStorageL), actualDrainageL:r(actualDrainageL), remainingL:r(remainingL),
    storageCapL, drainCapL, permeableM2:r(permeableArea), asphaltM2:r(asphaltArea), soilM2:r(soilArea), vegetationM2:r(vegetationArea),
    assumptionsVersion:'educational-v1'};
}
function curConfig(){ return {precipitationMm:S.sim.precipitationMm, areaM2:AREA, surfacePercent:{...S.sim.surfacePercent}, selectedTechIds:[...S.sim.selectedTechIds]}; }
function techCost(ids){ return ids.reduce((s,id)=>s+(SIM_TECH_BY[id]?SIM_TECH_BY[id].cost:0),0); }
function diffConfigs(a,b){
  const ch = [];
  if(a.precipitationMm!==b.precipitationMm) ch.push(`강수량 ${a.precipitationMm}mm → ${b.precipitationMm}mm`);
  const pa=a.surfacePercent, pb=b.surfacePercent;
  if(pa.asphalt!==pb.asphalt||pa.soil!==pb.soil||pa.vegetation!==pb.vegetation) ch.push(`지표면 비율 ${pa.asphalt}/${pa.soil}/${pa.vegetation}% → ${pb.asphalt}/${pb.soil}/${pb.vegetation}% (아스팔트/흙/식생)`);
  SIM_TECH.forEach(t=>{ const ia=a.selectedTechIds.includes(t.id), ib=b.selectedTechIds.includes(t.id); if(ia!==ib) ch.push(`${TECH_BY[t.id].name} ${ib?'추가':'제거'}`); });
  return ch;
}

/* ---------------- experiment stats ---------------- */
function surfStats(s){
  const poured = s.poured.trim()==='' ? null : Number(s.poured);
  const pouredOk = poured!=null && Number.isFinite(poured) && poured>0;
  const pouredErr = s.poured.trim()!=='' && !pouredOk ? '부은 물의 양은 0보다 큰 수로 입력해 주세요.' : '';
  const runs = s.runs.map((r,i)=>{
    if(r.failed) return {i, status:'failed', label:'측정 실패'};
    if(r.value.trim()==='') return {i, status:'empty', label:'미측정'};
    const v = Number(r.value);
    if(!Number.isFinite(v)) return {i, status:'error', label:'숫자를 입력해 주세요'};
    if(v<0) return {i, status:'error', label:'0 이상으로 입력해 주세요'};
    if(pouredOk && v>poured) return {i, status:'error', v, label:'부은 물보다 많아요. 다시 확인해 보세요'};
    return {i, status:'ok', v, rate: pouredOk ? v/poured*100 : null, label: pouredOk ? `유출률 ${fmt(v/poured*100)}%` : '유출률: 부은 물 입력 필요'};
  });
  const valid = runs.filter(r=>r.status==='ok');
  const avg = valid.length ? valid.reduce((a,r)=>a+r.v,0)/valid.length : null;
  return {poured: pouredOk?poured:null, pouredErr, runs, valid, avg, rate: (avg!=null && pouredOk) ? avg/poured*100 : null};
}

/* ---------------- evidence ---------------- */
function evidenceCandidates(){
  const out = [];
  const c = CASES[S.selectedCaseId];
  if(S.causeHypothesis.trim() || S.hypothesisEvidence.trim()){
    const facts = caseFacts();
    out.push({id:'case-'+c.id, source:'case', title:`사건 분석: ${c.place}(${c.name})`,
      detail:`확인한 사실: ${facts.length?facts.join(' / '):'미기록'}\n원인 가설: ${S.causeHypothesis.trim()||'미기록'}\n근거: ${S.hypothesisEvidence.trim()||'미기록'}`});
  }
  S.compareTech.forEach(id=>{
    const t = TECH_BY[id]; const n = S.technologyNotes[id]||{};
    out.push({id:'tech-'+id, source:'technology', title:`기술 도감: ${t.name}`,
      detail:`원리(도감): ${t.principle}\n도감에 적힌 한계: ${t.limit}\n내가 쓴 장점: ${(n.pros||'').trim()||'미기록'}\n내가 쓴 한계: ${(n.cons||'').trim()||'미기록'}`});
  });
  S.exp.surfaces.forEach(s=>{
    const st = surfStats(s);
    if(!st.valid.length) return;
    out.push({id:'exp-'+s.id, source:'physical-experiment', title:`실물 실험: ${s.name.trim()||'이름 없는 표면'}`,
      detail:`부은 물 ${st.poured!=null?fmt(st.poured)+'mL':'미기록'}, 측정한 표면 유출량 ${st.valid.map(r=>fmt(r.v)+'mL').join(', ')} (평균 ${fmt(st.avg)}mL${st.rate!=null?`, 유출률 ${fmt(st.rate)}%`:''})${s.observation.trim()?`\n관찰: ${s.observation.trim()}`:''}`});
  });
  const A = S.simulationA, B = S.simulationB;
  const simLine = (x)=>`강수량 ${x.config.precipitationMm}mm, 아스팔트/흙/식생 ${x.config.surfacePercent.asphalt}/${x.config.surfacePercent.soil}/${x.config.surfacePercent.vegetation}%, 기술: ${x.config.selectedTechIds.length?x.config.selectedTechIds.map(id=>TECH_BY[id].name).join('+'):'없음'}\n→ 유출 ${L(x.result.runoffL)}, 저류 ${L(x.result.actualStorageL)}, 배수 ${L(x.result.actualDrainageL)}, 처리 후 남은 양 ${L(x.result.remainingL)}`;
  if(A) out.push({id:'sim-A', source:'simulation', title:'가상 시뮬레이션: A 기존 도시', detail:simLine(A)});
  if(B) out.push({id:'sim-B', source:'simulation', title:'가상 시뮬레이션: B 변경 도시', detail:simLine(B)});
  if(A && B){
    const ch = diffConfigs(A.config, B.config);
    const d = k => { const x = B.result[k]-A.result[k]; return (x>0?'+':'')+fmt(x,0)+'L'; };
    out.push({id:'sim-AB', source:'simulation', title:'가상 시뮬레이션: A/B 비교',
      detail:`바꾼 조건: ${ch.length?ch.join(', '):'없음'}\n변화: 유출 ${d('runoffL')}, 저류 ${d('actualStorageL')}, 배수 ${d('actualDrainageL')}, 처리 후 남은 양 ${L(A.result.remainingL)} → ${L(B.result.remainingL)} (${d('remainingL')})${S.simChanged.trim()?`\n내가 기록한 달라진 점: ${S.simChanged.trim()}`:''}`});
  }
  return out;
}

function expChartSVG(){

  const raw = Math.max(50, ...vals); const max = Math.ceil(raw/50)*50;
  const W=600, H=300, l=58, r=12, t=16, b=56; const pw=W-l-r, ph=H-t-b; const n=list.length; const cw = pw/n;

  for(let i=0;i<=5;i++){ const v = max*i/5, y = t+ph-ph*i/5; g+=`<line x1="${l}" y1="${y}" x2="${W-r}" y2="${y}" style="stroke:var(--line)"/>`+T(l-6, y+4, fmt(v,0), 'font-size="11" text-anchor="end" font-family="IBM Plex Mono, monospace" style="fill:var(--muted)"'); }
  list.forEach((o,i)=>{

    if(o.st.avg!=null){ const h = ph*o.st.avg/max; g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${(t+ph-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="url(#ex-${pats[i%pats.length]})" style="stroke:var(--ink)" stroke-width="1"/>`+T(cx, t+ph-h-6, `평균 ${fmt(o.st.avg)}mL`, 'font-size="12" text-anchor="middle" font-weight="600"');
      o.st.valid.forEach((rr,k)=>{ const y = t+ph-ph*rr.v/max; g+=`<circle cx="${(cx+bw/2+10+k*0).toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" style="fill:var(--panel);stroke:var(--ink)" stroke-width="2"/>`; });
    } else g += T(cx, t+ph-8, '미측정', 'font-size="12" text-anchor="middle" style="fill:var(--muted)"');

  });

function expTableHTML(){

function simOutHTML(cfg,res){
  const perm = cfg.selectedTechIds.includes('permeable');

  const sp = cfg.surfacePercent;
  return `<div class="resgrid">
    <div class="res"><div class="k">총강수량</div><div class="v">${fmt(res.rainL,0)}<small>L</small></div></div>
    <div class="res"><div class="k">표면 유출량</div><div class="v">${fmt(res.runoffL,0)}<small>L</small></div></div>
    <div class="res"><div class="k">저류량</div><div class="v">${fmt(res.actualStorageL,0)}<small>L</small></div></div>
    <div class="res"><div class="k">배수 처리량</div><div class="v">${fmt(res.actualDrainageL,0)}<small>L</small></div></div>
    <div class="res em"><div class="k">처리 후 남은 양</div><div class="v">${fmt(res.remainingL,0)}<small>L</small></div></div></div>
    ${permNote}
    <div class="svgbox" style="background:var(--panel)">${simBarsSVG([{label:'현재',res}])}<div class="svgcap">수치 그래프 · 모든 막대는 같은 축(L)을 씁니다</div></div>
    <details class="how" id="how"><summary>어떻게 계산했나요?</summary><div class="in">
      <p><b>1mm × 1m² = 1L</b>. 지표면마다 교육용 임의 유출계수 C를 곱해 표면 유출량을 구합니다.</p>
      <div class="tbl-wrap"><table><thead><tr><th>지표면</th><th class="n">면적</th><th class="n">유출계수 C(가정값)</th><th class="n">면적×C</th></tr></thead><tbody>
      <tr><td>아스팔트</td><td class="n">${fmt(res.asphaltM2)} m²</td><td class="n">0.90</td><td class="n">${fmt(res.asphaltM2*0.9,2)}</td></tr>
      <tr><td>투수성 포장</td><td class="n">${fmt(res.permeableM2)} m²</td><td class="n">0.35</td><td class="n">${fmt(res.permeableM2*0.35,2)}</td></tr>
      <tr><td>일반 흙</td><td class="n">${fmt(res.soilM2)} m²</td><td class="n">0.55</td><td class="n">${fmt(res.soilM2*0.55,2)}</td></tr>
      <tr><td>식생</td><td class="n">${fmt(res.vegetationM2)} m²</td><td class="n">0.25</td><td class="n">${fmt(res.vegetationM2*0.25,2)}</td></tr></tbody></table></div>
      <span class="formula">표면 유출량 R = P × Σ(면적 × C)
  = ${cfg.precipitationMm} × ${fmt(res.asphaltM2*0.9+res.permeableM2*0.35+res.soilM2*0.55+res.vegetationM2*0.25,2)} = ${fmt(res.runoffL,1)} L
실제 저류량 = min(R, 저류용량 ${fmt(res.storageCapL,0)}) = ${fmt(res.actualStorageL,1)} L
실제 배수 처리량 = min(max(0, R − 저류량), 배수용량 ${fmt(res.drainCapL,0)}) = ${fmt(res.actualDrainageL,1)} L
처리 후 남은 양 = max(0, R − 저류량 − 배수 처리량) = ${fmt(res.remainingL,1)} L</span>
      <p class="small"><b>가정과 한계</b>: 유출계수는 관측·검증된 실제 계수가 아니라 이 앱에서 정한 가정값입니다. 실제 지형, 하천 수위, 배수관망, 비가 내린 시간과 세기, 바깥에서 흘러드는 물은 들어 있지 않습니다. ‘남은 양’은 침수 깊이나 피해가 아닙니다. (현재 조건: 아스팔트/흙/식생 ${sp.asphalt}/${sp.soil}/${sp.vegetation}%, 모형 버전 educational-v1)</p>
    </div></details>`;
}
function abHTML(){
  const A=S.simulationA, B=S.simulationB;
  if(!A && !B) return '<p class="empty">아직 저장한 조건이 없어요. 기본 조건 그대로 A를 저장해 보세요.</p>';
  const col = (x,lab)=> x ? `<td class="n">${x.config.precipitationMm}mm</td>` : `<td class="n"><span class="missing">미저장</span></td>`;
  const row = (name, f) => `<tr><td>${name}</td><td class="n">${A?f(A):'<span class="missing">–</span>'}</td><td class="n">${B?f(B):'<span class="missing">–</span>'}</td><td class="n">${A&&B?(()=>{ const d=f(B,true)-f(A,true); return (d>0?'+':'')+fmt(d,0); })():''}</td></tr>`;
  const sp = x => `${x.config.surfacePercent.asphalt}/${x.config.surfacePercent.soil}/${x.config.surfacePercent.vegetation}`;
  const techs = x => x.config.selectedTechIds.length ? x.config.selectedTechIds.map(id=>TECH_BY[id].name).join(', ') : '없음';
  const nr = k => (x,raw)=> raw ? x.result[k] : fmt(x.result[k],0)+' L';
  let warn = '';
  if(A && B){ const ch = diffConfigs(A.config,B.config);
    warn = ch.length===0 ? '<p class="warn">A와 B의 조건이 같아요. 조건 하나를 바꾼 뒤 B를 다시 저장하세요.</p>'
      : ch.length===1 ? `<p class="okbox"><b>공정한 비교인가요?</b> 바뀐 조건은 한 가지예요: ${esc(ch[0])}</p>`
      : `<p class="warn"><b>동시에 여러 조건이 달라져 원인 해석에 주의</b>하세요. 바뀐 조건 ${ch.length}개: ${ch.map(esc).join(' · ')}</p>`; }
  return `${warn}<div class="tbl-wrap"><table><thead><tr><th>항목</th><th class="n">A</th><th class="n">B</th><th class="n">B−A</th></tr></thead><tbody>
    <tr><td>강수량</td>${col(A)}${col(B)}<td></td></tr>
    <tr><td>아스팔트/흙/식생</td><td class="n">${A?sp(A)+'%':'–'}</td><td class="n">${B?sp(B)+'%':'–'}</td><td></td></tr>
    <tr><td>대응 기술</td><td>${A?esc(techs(A)):'–'}</td><td>${B?esc(techs(B)):'–'}</td><td></td></tr>
    ${row('총강수량', nr('rainL'))}${row('표면 유출량', nr('runoffL'))}${row('저류량', nr('actualStorageL'))}${row('배수 처리량', nr('actualDrainageL'))}${row('처리 후 남은 양', nr('remainingL'))}
  </tbody></table></div>
  ${A&&B?`<div class="svgbox" style="background:var(--panel)">${simBarsSVG([{label:'A',res:A.result},{label:'B',res:B.result}])}<div class="svgcap">빗금 막대 = A, 채운 막대 = B · 같은 축(L)</div></div>`:''}
  <p class="tiny muted">교육용 가상 시뮬레이션 결과</p>`;
}

        ${sel?`<label class="f">이 근거가 발명 아이디어와 어떤 관계가 있을까요?${tb('invention.evidenceReasons.'+x.id)}</label>`:''}</div>`; }).join('') : `<p class="empty">${src==='physical-experiment'?'③ 유출 실험 기록실에 측정값을 입력하면 여기에 나타나요.':src==='simulation'?'④ 도시 시뮬레이션에서 A 또는 B를 저장하면 여기에 나타나요.':src==='technology'?'② 빗물·기술 도감에서 비교할 기술을 고르면 여기에 나타나요.':'① 재난 사건실에서 원인 가설을 쓰면 여기에 나타나요.'}</p>`}</div>`;

/* ---------------- sketch ---------------- */
let sk = {color:'#1D2D3A', w:6, eraser:false, undo:[], drawing:false};
function initSketch(){
  const cv = document.getElementById('sketch'); if(!cv) return;
  const ctx = cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  sk.undo = [];
  if(S.invention.sketchDataUrl){ const img = new Image(); img.onload = ()=>ctx.drawImage(img,0,0,cv.width,cv.height); img.src = S.invention.sketchDataUrl; }
  document.querySelectorAll('[data-act="pen"]').forEach(b=>b.setAttribute('aria-pressed', String(!sk.eraser && b.dataset.c===sk.color)));
  document.querySelectorAll('[data-act="penw"]').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.w===sk.w)));
  const er = document.querySelector('[data-act="eraser"]'); if(er) er.setAttribute('aria-pressed', String(sk.eraser));
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height]; };
  let last = null;
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); if(sk.undo.length>25) sk.undo.shift(); sk.undo.push(ctx.getImageData(0,0,cv.width,cv.height)); sk.drawing=true; last=pos(e); dot(last); });
  cv.addEventListener('pointermove', e=>{ if(!sk.drawing) return; const p = pos(e); ctx.strokeStyle = sk.eraser?'#fff':sk.color; ctx.lineWidth = sk.eraser?sk.w*3:sk.w; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; });
  const end = ()=>{ if(!sk.drawing) return; sk.drawing=false; storeSketch(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
  function dot(p){ ctx.fillStyle = sk.eraser?'#fff':sk.color; ctx.beginPath(); ctx.arc(p[0],p[1],(sk.eraser?sk.w*3:sk.w)/2,0,Math.PI*2); ctx.fill(); }
}
function storeSketch(){
  const cv = document.getElementById('sketch'); if(!cv) return;
  // detect blank
  const ctx = cv.getContext('2d'); const d = ctx.getImageData(0,0,cv.width,cv.height).data; let blank = true;
  for(let i=0;i<d.length;i+=16){ if(d[i]<250||d[i+1]<250||d[i+2]<250){ blank=false; break; } }
  S.invention.sketchDataUrl = blank ? '' : cv.toDataURL('image/png');
  save();
}

function csvModal(){
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [['표면','부은 물(mL)','측정 시간(초)','1회(mL)','2회(mL)','3회(mL)','평균(mL)','유출률(%)','관찰'].map(q).join(',')];
  S.exp.surfaces.forEach(s=>{ const st = surfStats(s);
    lines.push([s.name, st.poured??'미기록', s.duration||'', ...st.runs.map(r=>r.status==='ok'?r.v:r.status==='failed'?'측정 실패':r.status==='error'?'확인 필요':'미측정'), st.avg!=null?Math.round(st.avg*10)/10:'미측정', st.rate!=null?Math.round(st.rate*10)/10:'', s.observation].map(q).join(',')); });

/* ---------------- sim interaction ---------------- */
function setSurface(key, v){
  const sp = {...S.sim.surfacePercent}; v = clamp(Math.round(num(v,sp[key])),0,100);
  const others = ['asphalt','soil','vegetation'].filter(k=>k!==key);
  const rest = 100 - v; const sumO = sp[others[0]] + sp[others[1]];
  const a = sumO===0 ? Math.round(rest/2) : Math.round(rest*sp[others[0]]/sumO);
  sp[key]=v; sp[others[0]]=a; sp[others[1]]=rest-a;
  S.sim.surfacePercent = sp;
}
function refreshSim(skipEl){
  const cfg = curConfig(), res = calcModel(cfg);
  ['asphalt','soil','vegetation'].forEach(k=>{ ['rg-','nm-'].forEach(pf=>{ const el = document.getElementById(pf+k); if(el && el!==skipEl) el.value = S.sim.surfacePercent[k]; }); });
  ['rg-p','nm-p'].forEach(id=>{ const el = document.getElementById(id); if(el && el!==skipEl) el.value = S.sim.precipitationMm; });
  const sp = S.sim.surfacePercent; const sl = document.getElementById('sumline'); if(sl) sl.querySelector('.num').textContent = (sp.asphalt+sp.soil+sp.vegetation)+'%';
  document.getElementById('sim-city').innerHTML = citySVG(cfg,res);
  const how = document.getElementById('how'); const open = how && how.open;
  document.getElementById('sim-out').innerHTML = simOutHTML(cfg,res);
  if(open) document.getElementById('how').open = true;
  save();
}

  closeModal, closeModalBg: (el,e)=>{ if(e.target===el) closeModal(); },
  doReset: ()=>{ try{ localStorage.removeItem(LS_KEY); }catch(e){} S = defaults(); closeModal(); save(true); render(); toast('기록을 지우고 새로 시작했어요.'); },
  continue: ()=>{ closeModal(); },
  askNew: ()=>{ document.getElementById('newconfirm').innerHTML = `<div class="warn" style="display:grid;gap:8px"><span>새로 시작하면 이 브라우저의 이전 기록이 지워집니다. 필요하면 먼저 ‘이전 기록 이어하기’ → 기록 관리에서 JSON으로 백업하세요.</span><div class="row"><button type="button" class="btn danger" data-act="doReset">지우고 새로 시작</button></div></div>`; },
  copyJson: ()=>copyFrom('json-out'), copyCsv: ()=>copyFrom('csv-out'), csv: csvModal,
  importJson: ()=>{ const t = document.getElementById('json-in').value.trim(); importText(t); },
  pickCase: el => { S.selectedCaseId = el.dataset.id; save(); render(true); },
  sortClue: el => { const k = el.dataset.key; S.clueSort[k] = S.clueSort[k]===el.dataset.v ? undefined : el.dataset.v; if(!S.clueSort[k]) delete S.clueSort[k]; save(); render(true); },
  saveCase: ()=>{ S.caseSavedAt = now(); save(true); document.getElementById('caseSaved').textContent = `보고서에 반영됨 · ${new Date(S.caseSavedAt).toLocaleString('ko-KR')}`; toast('사건 분석 기록을 저장했어요. 보고서에 반영됩니다.'); },
  q: el => { S.qIndex = (S.qIndex + +el.dataset.d + QCARDS.length) % QCARDS.length; save(); render(true); },
  flow: el => { S.flowSurface = el.dataset.v; save(); render(true); },
  slope: el => { S.flowSlope = el.dataset.v; save(); render(true); },
  checkMatch: ()=>{ TECHS.forEach(t=>{ S.matchChecked[t.id] = !!S.matching[t.id]; }); save(); render(true); },
  cmpTech: el => { const id = el.dataset.id; const a = S.compareTech; if(a.includes(id)) S.compareTech = a.filter(x=>x!==id); else if(a.length<2) a.push(id); else { toast('이미 두 기술을 골랐어요. 하나를 먼저 해제하세요.'); return; } save(); render(true); },
  failRun: el => { const r = S.exp.surfaces[+el.dataset.si].runs[+el.dataset.ri]; r.failed = !r.failed; save(); render(true); },
  addSurface: ()=>{ S.exp.surfaces.push(newSurface('', '200')); save(); render(true); },
  delSurface: el => { S.exp.surfaces.splice(+el.dataset.si,1); save(); render(true); },
  simTech: el => { const id = el.dataset.id; const a = S.sim.selectedTechIds; if(a.includes(id)) S.sim.selectedTechIds = a.filter(x=>x!==id); else { if(techCost(a)+SIM_TECH_BY[id].cost>BUDGET){ toast('교육용 예산 4점을 넘어서 선택할 수 없어요.'); return; } a.push(id); } save(); render(true); },
  simReset: ()=>{ S.sim = defaults().sim; save(); render(true); toast('조건을 기본값으로 되돌렸어요.'); },
  saveA: ()=>{ const c = curConfig(); S.simulationA = {config:c, result:calcModel(c), savedAt:now()}; save(true); refreshAB(); toast('지금 조건을 A로 저장했어요. 이제 조건 하나만 바꿔 보세요.'); },
  saveB: ()=>{ if(!S.simulationA){ toast('먼저 A를 저장해 주세요.'); return; } const c = curConfig(); S.simulationB = {config:c, result:calcModel(c), savedAt:now()}; save(true); refreshAB(); toast('B를 저장했어요. 아래에서 A와 비교해 보세요.'); },
  recordSim: ()=>{ if(!(S.simulationA && S.simulationB)){ toast('A와 B를 모두 저장한 뒤 기록할 수 있어요.'); return; } S.simRecordedAt = now(); save(true); render(true); toast('비교 결과를 기록했어요. ⑤ 발명 탭에서 근거로 가져올 수 있어요.'); },
  problem: el => { S.invention.problemPreset = S.invention.problemPreset===el.dataset.v ? '' : el.dataset.v; save(); render(true); },
  mode: el => { S.invention.modificationMode = S.invention.modificationMode===el.dataset.v ? '' : el.dataset.v; save(); render(true); },
  invTech: el => { const a = S.invention.existingTechnologyIds, id = el.dataset.id; if(a.includes(id)) S.invention.existingTechnologyIds = a.filter(x=>x!==id); else if(a.length<2) a.push(id); else { toast('기존 기술은 2개까지 고를 수 있어요.'); return; } save(); render(true); },

  pen: el => { sk.color = el.dataset.c; sk.eraser=false; document.querySelectorAll('[data-act="pen"]').forEach(b=>b.setAttribute('aria-pressed', String(b===el))); const er=document.querySelector('[data-act="eraser"]'); if(er) er.setAttribute('aria-pressed','false'); },
  penw: el => { sk.w = +el.dataset.w; document.querySelectorAll('[data-act="penw"]').forEach(b=>b.setAttribute('aria-pressed', String(b===el))); },

  clearSketch: ()=>{ const cv = document.getElementById('sketch'); if(!cv) return; const ctx = cv.getContext('2d'); sk.undo.push(ctx.getImageData(0,0,cv.width,cv.height)); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); storeSketch(); toast('그림을 지웠어요. ‘취소’로 되돌릴 수 있어요.'); }
};
function refreshAB(){ const el = document.getElementById('ab'); if(el) el.innerHTML = abHTML(); }
function copyFrom(id){
  const ta = document.getElementById(id);
  const fallback = ()=>{ ta.focus(); ta.select(); toast('자동 복사가 막혀 있어요. 선택된 내용을 Ctrl+C(⌘+C)로 복사하세요.', 4000); };
  try{ navigator.clipboard.writeText(ta.value).then(()=>toast('복사했어요.'), fallback); }catch(e){ fallback(); }
}
function importText(t){
  const err = document.getElementById('json-err');
  let data;
  try{ data = JSON.parse(t); }catch(e){ err.textContent = 'JSON 형식이 아니에요. 백업한 내용을 처음부터 끝까지 그대로 붙여 넣어 주세요.'; return; }
  if(!data || typeof data!=='object' || data.version!==1){ err.textContent = '이 앱의 백업 파일(version 1)이 아니에요.'; return; }
  S = sanitize(data); save(true); closeModal(); render(); toast('기록을 불러왔어요.');
}
const CHG = {
  match: el => { S.matching[el.dataset.id] = el.value; S.matchChecked[el.dataset.id] = false; save(); render(true); },
  ctrl: el => { const v = el.dataset.v; const a = S.exp.controlled; if(el.checked){ if(!a.includes(v)) a.push(v); } else S.exp.controlled = a.filter(x=>x!==v); save(); },
  evidence: el => { const id = el.dataset.id; const I = S.invention;
    if(el.checked){ const c = evidenceCandidates().find(x=>x.id===id); if(c){ S.evidence = S.evidence.filter(e=>e.id!==id); S.evidence.push({id:c.id, source:c.source, title:c.title, detail:c.detail, recordedAt:now()}); if(!I.evidenceIds.includes(id)) I.evidenceIds.push(id); } }
    else { I.evidenceIds = I.evidenceIds.filter(x=>x!==id); S.evidence = S.evidence.filter(e=>e.id!==id); }
    save(); render(true); },
  rcheck: el => { S.invention.checks[el.dataset.id] = el.checked; save(); },
  jsonFile: el => { const f = el.files && el.files[0]; if(!f) return; const r = new FileReader(); r.onload = ()=>{ document.getElementById('json-in').value = String(r.result); importText(String(r.result)); }; r.readAsText(f); }
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='INPUT' || el.tagName==='SELECT') return;
  const f = ACT[el.dataset.act]; if(f) f(el, e);
});
document.addEventListener('change', e=>{ const el = e.target.closest('[data-act-change]'); if(el && CHG[el.dataset.actChange]) CHG[el.dataset.actChange](el); });
document.addEventListener('input', e=>{
  const el = e.target;
  if(el.dataset.bind){
    setPath(el.dataset.bind, el.value); save();
    if(el.dataset.live==='exp') liveExp(el);
    return;
  }
  if(el.dataset.sim){
    const k = el.dataset.sim;
    if(k==='p'){ if(el.value==='') return; S.sim.precipitationMm = clamp(Math.round(num(el.value,50)/10)*10,10,120); }
    else { if(el.value==='') return; setSurface(k, el.value); }
    refreshSim(el.type==='number'?el:null);
  }
});
document.addEventListener('focusout', e=>{ const el = e.target; if(el.dataset && el.dataset.sim && el.type==='number'){ refreshSim(null); } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.querySelector('.modal')) closeModal();
  const t = e.target.closest && e.target.closest('[role="tab"]');
  if(t && (e.key==='ArrowRight'||e.key==='ArrowLeft')){ const i = TABS.findIndex(x=>x.id===S.tab); const n = TABS[(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length]; go(n.id); const nt = document.getElementById('tab-'+n.id); if(nt) nt.focus(); }
});
function liveExp(el){
  // update status labels + data view without re-rendering inputs
  S.exp.surfaces.forEach(s=>{
    const st = surfStats(s);
    st.runs.forEach((r,ri)=>{ const lab = document.getElementById(`st-${s.id}-${ri}`); if(lab){ lab.textContent = r.label; lab.classList.toggle('bad', r.status==='error'); } const inp = document.getElementById(`r-${s.id}-${ri}`); if(inp) inp.classList.toggle('bad', r.status==='error'); });
    const pe = document.getElementById('pe-'+s.id); if(pe) pe.textContent = st.pouredErr;
    const pi = document.getElementById('sp-'+s.id); if(pi) pi.classList.toggle('bad', !!st.pouredErr);
  });
  const d = document.getElementById('exp-data'); if(d) d.innerHTML = expDataHTML();
}
window.addEventListener('hashchange', ()=>{ const h = location.hash.slice(1); if(h && h!==S.tab && TABS.find(t=>t.id===h)) go(h); });

/* ---------------- boot ---------------- */
const h0 = location.hash.slice(1); if(TABS.find(t=>t.id===h0)) S.tab = h0;
render(); updatePrint();
startModal();
})();
</script>
</body>
</html>
